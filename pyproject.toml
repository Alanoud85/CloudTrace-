[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudtrace-mvad"
version = "1.0.0"
description = "Leakage-audited label-free multi-view anomaly detection for AWS CloudTrail"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn==1.6.1",
  "torch>=2.2,<3",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
  "PyYAML>=6.0,<7",
  "psutil>=5.9,<8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
